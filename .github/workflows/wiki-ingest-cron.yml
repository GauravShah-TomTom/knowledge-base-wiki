name: Wiki ingestion (cron)

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  id-token: write       # OIDC federation
  contents: write       # Push branches
  pull-requests: write  # Open PRs

concurrency:
  group: wiki-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_ACCOUNT: stteamwikiulkrw5
      RAW_CONTAINER: raw

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clear runner's pre-existing Azure context
        run: |
          az logout 2>/dev/null || true
          az account clear 2>/dev/null || true

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pin subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Download new blobs
        run: bash scripts/azure-blob-download.sh

      - name: Detect changes
        id: detect
        run: |
          if [ -z "$(git status --porcelain raw/ wiki/log.jsonl)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No new blobs to ingest."
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            git status --short raw/ wiki/log.jsonl | head -10
          fi

      - name: Commit and push to ingestion branch
        if: steps.detect.outputs.changes == 'true'
        id: branch
        run: |
          BRANCH="ingest/${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add raw/ wiki/log.jsonl
          NEW_COUNT=$(git status --porcelain raw/ | grep -c '^?? \|^A ' || echo 0)
          git commit -m "ingest: pulled $NEW_COUNT new blob(s) from Azure raw/"
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.detect.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BLOBS=$(git diff --stat HEAD~1 HEAD -- raw/ | head -20)
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "ingest: blobs from run #${GITHUB_RUN_NUMBER}" \
            --body "Auto-generated by the wiki-ingest cron Action.

          The blobs below were just downloaded from \`${AZURE_STORAGE_ACCOUNT}/${RAW_CONTAINER}\`. \
          Each one was appended to \`wiki/log.jsonl\` with status=seen so the next cron run skips them.

          **Next step**: pull this branch locally, run \`scripts/wiki-ingest-loop.sh\` to convert + ingest, push, then merge.

          \`\`\`
          ${BLOBS}
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          " \
            --label "auto-ingest" || true

      - name: No-op message
        if: steps.detect.outputs.changes == 'false'
        run: echo "Nothing to do — no new blobs in raw/."

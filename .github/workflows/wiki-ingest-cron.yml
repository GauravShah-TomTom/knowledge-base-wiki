name: Wiki ingestion (cron)

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  id-token: write       # OIDC federation
  contents: write       # Push branches
  pull-requests: write  # Open PRs

concurrency:
  group: wiki-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_ACCOUNT: stteamwikiulkrw5
      RAW_CONTAINER: raw

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clear runner's pre-existing Azure context
        run: |
          az logout 2>/dev/null || true
          az account clear 2>/dev/null || true

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pin subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Download new blobs
        run: bash scripts/azure-blob-download.sh

      - name: Detect changes
        id: detect
        run: |
          NEW=$(git ls-files --others --ignored --exclude-standard raw/ wiki/log.jsonl 2>/dev/null | wc -l | tr -d " ")
          if [ "$NEW" -eq 0 ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No new blobs to ingest."
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Files staged:"
            git ls-files --others --ignored --exclude-standard raw/ wiki/log.jsonl | head -10
          fi

      - name: Commit and push to ingestion branch
        if: steps.detect.outputs.changes == 'true'
        id: branch
        run: |
          BRANCH="ingest/${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -f raw/ wiki/log.jsonl
          NEW_COUNT=$(git diff --cached --numstat raw/ | wc -l | tr -d " ")
          git commit -m "ingest: pulled $NEW_COUNT new blob(s) from Azure raw/"
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.detect.outputs.changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BLOBS=$(git diff --stat HEAD~1 HEAD -- raw/ | head -20)
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "ingest: blobs from run #${GITHUB_RUN_NUMBER}" \
            --body "Auto-generated by the wiki-ingest cron Action.

          Raw blobs from \`${AZURE_STORAGE_ACCOUNT}/${RAW_CONTAINER}\` are listed below. The next workflow step runs Claude Code to convert these into \`wiki/\` pages and commit them to this PR. If no conflicts are detected, the PR auto-merges; if \`⚠️ CONFLICT\` is raised, the PR is held for CODEOWNERS review.

          \`\`\`
          ${BLOBS}
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          " \
            --label "auto-ingest")
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Opened PR #$PR_NUMBER: $PR_URL"

      - name: Run wiki-ingest skill (Claude Code)
        if: steps.detect.outputs.changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-4-6
          prompt: |
            You are running inside a GitHub Actions workflow on branch
            `${{ steps.branch.outputs.branch }}`. New raw files have just been
            pulled from Azure Blob into `raw/` and committed to this branch.
            PR #${{ steps.pr.outputs.number }} is already open.

            Your task: ingest the new raw files into `wiki/` by following the
            `wiki-ingest` skill end-to-end.

            1. Read `.claude/skills/wiki-ingest/SKILL.md`,
               `.claude/skills/wiki-ingest-per-note/SKILL.md`, and
               `.claude/skills/wiki-finalize-ingest/SKILL.md` so you understand
               the full procedure.
            2. Convert raw files to Markdown (Phase 0) using the VTT and EML
               conversion scripts already in the repo.
            3. Partition unprocessed notes via
               `bash scripts/wiki-create-import-batches.sh`.
            4. Process each batch following the per-note ingestion rules
               (topics, WikiLinks, conflict detection — see the per-note
               SKILL.md for the authoritative rules).
            5. Run the finalize step to merge logs and rebuild indexes.
            6. Commit the generated `wiki/` pages and updated `wiki/log.jsonl`
               to this branch with a clear commit message.

            Conflict handling: if a new page semantically contradicts an
            existing one, mark the affected page with `⚠️ CONFLICT` and quote
            both passages.

            Final step (mandatory): post a comment on PR
            #${{ steps.pr.outputs.number }} summarising the ingest. The comment
            MUST start with one of:
              - `Wiki ingestion complete — no conflicts.` (everything OK)
              - `⚠️ CONFLICT` (one or more pages flagged — list them)
            Use: `gh pr comment ${{ steps.pr.outputs.number }} --body "..."`.
            The auto-merge gate keys off whether the comment contains
            `⚠️ CONFLICT`, so this string must appear iff there is a real
            conflict.

      - name: Auto-merge gate
        if: steps.detect.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number captured — skipping auto-merge."
            exit 0
          fi

          COMMENTS=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body')
          if echo "$COMMENTS" | grep -q "⚠️ CONFLICT"; then
            echo "Conflict marker found — leaving PR #$PR_NUMBER for CODEOWNERS review."
            gh pr edit "$PR_NUMBER" --add-label "needs-review" || true
          else
            echo "No conflicts — enabling auto-merge on PR #$PR_NUMBER."
            gh pr merge "$PR_NUMBER" --auto --squash || \
              echo "Auto-merge could not be enabled (branch protection or already-merged)."
          fi

      - name: No-op message
        if: steps.detect.outputs.changes == 'false'
        run: echo "Nothing to do — no new blobs in raw/."

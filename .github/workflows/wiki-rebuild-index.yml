name: Wiki index rebuild

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  id-token: write       # OIDC federation
  contents: read

concurrency:
  # Cancel any older in-flight rebuild — only the latest wiki/ state matters.
  group: wiki-index-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_ACCOUNT: stteamwikiulkrw5
      INDEX_CONTAINER: wiki-index
      INDEX_BLOB: index.sqlite.gz
      # qmd's default — also where node-llama-cpp caches GGUF models.
      QMD_CACHE_DIR: /home/runner/.cache/qmd

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache QMD GGUF models
        # Models are large (100s of MB); caching avoids re-downloading every run.
        # Key is static — refresh by manually clearing the cache or bumping the suffix.
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/qmd/models
          key: qmd-models-v1
          restore-keys: qmd-models-

      - name: Install QMD
        run: |
          bun install -g @tobilu/qmd
          qmd --version

      - name: Clear runner's pre-existing Azure context
        run: |
          az logout 2>/dev/null || true
          az account clear 2>/dev/null || true

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pin subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Download previous index from Azure (cold-start tolerant)
        id: download
        run: |
          mkdir -p "$QMD_CACHE_DIR"
          DEST="$QMD_CACHE_DIR/index.sqlite"

          if az storage blob download \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$INDEX_CONTAINER" \
              --name "$INDEX_BLOB" \
              --file "$DEST.gz" \
              --auth-mode login \
              --no-progress 2>/tmp/download.err; then
            echo "Existing index found — extracting"
            gunzip -f "$DEST.gz"
            ls -lh "$DEST"
            echo "cold_start=false" >> "$GITHUB_OUTPUT"
          else
            ERR=$(cat /tmp/download.err || true)
            if echo "$ERR" | grep -qiE "BlobNotFound|not found|ResourceNotFound"; then
              echo "No prior index in $INDEX_CONTAINER/$INDEX_BLOB — cold-start rebuild"
              echo "cold_start=true" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: az download failed for non-NotFound reason:" >&2
              echo "$ERR" >&2
              exit 1
            fi
          fi

      - name: Register collections + qmd update
        # qmd-sync-collections.sh registers each wiki/<topic>/ subdir as a
        # qmd collection (idempotent — skips ones that exist) and runs
        # `qmd update` at the end to refresh the structural index.
        run: bash scripts/qmd-sync-collections.sh

      - name: Generate embeddings
        # Local GGUF embedding (no external API). First run downloads models;
        # subsequent runs reuse the cached models from the actions/cache step.
        run: qmd embed

      - name: Verify index exists
        id: verify
        run: |
          DB="$QMD_CACHE_DIR/index.sqlite"
          if [ ! -f "$DB" ]; then
            echo "ERROR: expected index at $DB after qmd update + embed" >&2
            find "$QMD_CACHE_DIR" -type f -name '*.sqlite*' >&2 || true
            exit 1
          fi
          ls -lh "$DB"
          echo "db=$DB" >> "$GITHUB_OUTPUT"

      - name: Gzip and upload index
        run: |
          DB="${{ steps.verify.outputs.db }}"
          gzip -fk "$DB"   # keep original; produces $DB.gz
          ls -lh "$DB.gz"
          bash scripts/qmd-sql-upload.sh "$DB.gz"

      - name: Summary
        run: |
          echo "## Wiki index rebuild complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cold start: ${{ steps.download.outputs.cold_start }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Index uploaded to: \`$AZURE_STORAGE_ACCOUNT/$INDEX_CONTAINER/$INDEX_BLOB\`" >> "$GITHUB_STEP_SUMMARY"

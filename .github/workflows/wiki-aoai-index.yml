name: Index wiki to Azure AI Search

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: wiki-aoai-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest

    env:
      AZURE_SEARCH_ENDPOINT: https://srch-team-wiki-ulkrw5.search.windows.net
      AZURE_SEARCH_INDEX_NAME: team-wiki
      AZURE_SEARCH_API_VERSION: 2024-07-01
      AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
      AZURE_OPENAI_ENDPOINT: https://api.chatgpt.tomtom-global.com
      AZURE_OPENAI_API_VERSION: "2024-10-21"
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: dep-text-embedding-3-small
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect changed wiki pages
        id: changed
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v45
        with:
          files: wiki/*/*.md
          files_ignore: wiki/**/_*.md
          separator: "\n"
          json: false

      - name: Clear runner's pre-existing Azure context
        run: |
          az logout 2>/dev/null || true
          az account clear 2>/dev/null || true

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pin subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Install Python deps
        run: pip install --quiet requests pyyaml

      - name: Push schema + docs to Azure AI Search
        env:
          # Push events run incremental (only changed pages re-embedded).
          # workflow_dispatch falls through with mode unset → script defaults to full.
          WIKI_INDEX_MODE: ${{ github.event_name == 'push' && 'incremental' || 'full' }}
          WIKI_CHANGED_FILES: |
            ${{ steps.changed.outputs.added_files }}
            ${{ steps.changed.outputs.modified_files }}
          WIKI_DELETED_FILES: ${{ steps.changed.outputs.deleted_files }}
        run: python3 scripts/aoai-index-wiki.py

      - name: Summary
        run: |
          MODE="${{ github.event_name == 'push' && 'incremental' || 'full' }}"
          echo "## Wiki indexed to Azure AI Search" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: \`$AZURE_SEARCH_ENDPOINT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Index: \`$AZURE_SEARCH_INDEX_NAME\`" >> "$GITHUB_STEP_SUMMARY"
